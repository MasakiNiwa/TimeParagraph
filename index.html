<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="パラグラフ単位で話す時間と内容を考えるエディタ" />
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#22252b" media="(prefers-color-scheme: dark)" />
    <title>TimeParagraph</title>
    <script>
      // 初回描画前にテーマを適用してちらつきを防ぐ
      try {
        var s = localStorage.getItem('timeparagraph:color-scheme') || 'auto';
        if (s === 'auto') s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', s);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
